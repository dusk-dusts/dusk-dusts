name: Update README stats (local script)

on:
  schedule:
    - cron: '0 */12 * * *'  # every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run update script
        env:
          GH_TOKEN: ${{ secrets.USER_TOKEN }}   # Provide PAT with repo scope to include private repos
          USERNAME: ${{ github.repository_owner }}  # or set a specific username
        run: |
          python scripts/update_readme_stats.py

      - name: Commit README update
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "readme: update stats"
            git push
          else
            echo "No changes to commit"
          fi
